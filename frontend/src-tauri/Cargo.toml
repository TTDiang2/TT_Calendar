[package]
name = "app"
version = "2.5.4"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2.12.0", features = ["rustls-tls"] }
tauri-plugin-process = "2.3.1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
]

# devtools 不进默认 feature 集：写在 tauri 的 features 里会让 release 也带上调试器，
# 用户右键即可执行任意 JS、查看本地数据，绕过前端能做的所有约束。故改为显式
# opt-in——开发用 `npm run tauri:dev` 带上，release 不带。
#
# custom-protocol 必须是独立 feature（Tauri CLI 约定名），由 `tauri build` 自动启用。
# 以前它被写死在 tauri 依赖的 features 里，后果是 `tauri dev` 也走内嵌协议、
# 加载 dist/ 里的旧构建产物——改了源码在 dev 窗口里看不到任何变化。
[features]
devtools = ["tauri/devtools"]
custom-protocol = ["tauri/custom-protocol"]
