name: Release

# 打 tag（v2.4.0）或手动触发时出一个完整的 Windows 发行版：
# setup.exe（NSIS）、msi、便携 zip、updater 产物与 latest.json。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "本次更新说明（会写进 latest.json 的 notes）"
        required: false
        default: ""

permissions:
  contents: write

env:
  # 从 tag 或 version.json 推导，后续所有步骤共用
  FORCE_COLOR: "1"
  # windows-latest 的默认控制台编码是 cp1252，本仓库脚本与 argparse 的文案都是中文，
  # 一旦 print 到 stdout 就 UnicodeEncodeError 退出（不是语法错，是编码错）。
  # 关掉这个坑：所有 Python 步骤走 UTF-8，不受 runner 语言设置影响。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  windows:
    runs-on: windows-latest
    # 提到 job 级只为让 step 的 if 能判断「有没有配令牌」——
    # GitHub 不允许在 if 里直接写 secrets.XXX（workflow 会校验失败、0 秒退出），
    # 但允许引用 env。令牌本身不会出现在日志里。
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # 版本号单一来源：version.json → tauri.conf / package.json / Cargo.toml / _build_version.py
      - name: Sync version
        run: python scripts/sync_version.py

      - name: Read version
        id: ver
        shell: bash
        run: |
          V=$(python -c "import json;print(json.load(open('version.json',encoding='utf-8'))['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
          fi
          echo "building $V"

      # tag 与 version.json 不一致时直接失败，避免「v2.4.1 的包里装着 2.4.0」
      - name: Verify tag matches version.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.ver.outputs.version }}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 version.json (${{ steps.ver.outputs.version }}) 不一致"
            exit 1
          fi

      - name: Build backend (onedir)
        run: python -m PyInstaller --noconfirm --clean tt-calendar-backend.spec

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build installer
        id: build
        working-directory: frontend
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            npx tauri build --features custom-protocol
          else
            echo "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY，本次不出自动更新产物（老版本收不到更新，只能手动下载）"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            npx tauri build --features custom-protocol --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Collect installer
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p release
          B=frontend/src-tauri/target/release/bundle
          ls -l "$B/nsis" "$B/msi" || true
          SETUP=$(ls "$B"/nsis/*-setup.exe | head -1)
          cp "$SETUP" "release/TT-Calendar-Setup-$V.exe"
          MSI=$(ls "$B"/msi/*.msi | head -1 || true)
          if [ -n "$MSI" ]; then cp "$MSI" "release/TT-Calendar-$V.msi"; fi

      - name: Build portable zip
        shell: powershell
        run: |
          ./scripts/make_portable_zip.ps1 -Version "${{ steps.ver.outputs.version }}" -Root "${{ github.workspace }}"

      # latest.json 必须指向「被签名的那份产物」，所以这一步既生成 json，
      # 也把 nsis.zip 复制成 release 里的固定资产名，两边对得上。
      - name: Generate latest.json
        if: steps.build.outputs.signed == 'true'
        shell: bash
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          python scripts/gen_latest_json.py \
            --tag "${{ steps.ver.outputs.tag }}" \
            --stage-dir release \
            --notes "$NOTES" \
            --out release/latest.json

      # 镜像清单要能被 raw 读到，所以必须落在默认分支上。
      # 失败不阻断发版：GitHub 主源 + release 资产里的 latest.json 仍然可用。
      - name: Publish mirror manifests
        if: steps.build.outputs.signed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-ghfast.json latest-ghproxy.json
          if git diff --cached --quiet; then
            echo "manifest 内容未变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(release): updater manifests for ${{ steps.ver.outputs.version }}"
          git fetch origin main
          git push origin HEAD:main || echo "::warning::镜像清单未能推送到 main（分支保护或非快进），请手动提交 latest-*.json"

      # Gitee 兜底源：没有配置 GITEE_TOKEN 时整步跳过，不影响其他源。
      - name: Mirror to Gitee
        if: steps.build.outputs.signed == 'true' && env.GITEE_TOKEN != ''
        shell: bash
        env:
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
        run: |
          python scripts/sync_gitee_update.py \
            --tag "${{ steps.ver.outputs.tag }}" \
            --version "${{ steps.ver.outputs.version }}" \
            --asset "release/TT-Calendar-Setup-${{ steps.ver.outputs.version }}.exe"

      - name: Checksums
        shell: bash
        run: |
          cd release
          for f in *; do
            case "$f" in
              *.json) ;;
              *) sha256sum "$f" >> SHA256SUMS.txt ;;
            esac
          done
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TT Calendar ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ${{ github.event.inputs.notes }}

            安装版：`TT-Calendar-Setup-${{ steps.ver.outputs.version }}.exe`
            便携版：`TT-Calendar-Portable-${{ steps.ver.outputs.version }}.zip`（解压即用，数据在同一目录）
          files: |
            release/TT-Calendar-Setup-*.exe
            release/TT-Calendar-*.msi
            release/TT-Calendar-Portable-*.zip
            release/TT-Calendar-*.nsis.zip
            release/latest.json
            release/SHA256SUMS.txt
