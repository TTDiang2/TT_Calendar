name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 必须跑 Windows：tt_calendar/sync/secrets.py 在导入期就用 ctypes.WinDLL 调
  # DPAPI，且 @esbuild/win32-x64 把 esbuild 二进制钉死在 win32。在 Linux 上跑
  # 会以「模块导入即 AttributeError」和 npm EBADPLATFORM 两种形态失败，而这两条
  # 与本项目无关——它本来就只发布 Windows 版。
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt pytest
      # plugins/ 未入库，故 CI 的检出就是「无插件的全新 clone」——
      # 这里天然复现并守住插件发现门禁在干净环境下必须通过这条约束。
      - run: python -m pytest tests -q

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
